<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Functional analog DVS pixel architecture</title><desc id="desc">Incident photons generate photodiode current. A logarithmic photoreceptor produces log intensity voltage. A change detection amplifier compares the current signal with a stored reference. Positive and negative comparators fire events, updating the reference. Address-event readout transmits pixel location and polarity. Diagram is conceptual and not a transistor schematic.</desc><defs><style>.bg{fill:#101c30}.block{fill:#172b45;stroke:#4db9d8;stroke-width:2}.txt{fill:#eef8ff;font:20px Arial,sans-serif}.sub{fill:#a9c0cf;font:15px Arial,sans-serif}.head{fill:#63d7ef;font:bold 21px Arial,sans-serif}.wire{stroke:#8adfeb;stroke-width:3;fill:none;marker-end:url(#arrow)}.fb{stroke:#f4a16c;stroke-width:2.5;fill:none;stroke-dasharray:8 5;marker-end:url(#amber)}.light{stroke:#f7d26f;stroke-width:4;marker-end:url(#yellow)}</style><marker id="arrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8adfeb"/></marker><marker id="amber" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f4a16c"/></marker><marker id="yellow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f7d26f"/></marker></defs><rect width="1200" height="460" rx="24" class="bg"/><text x="48" y="47" class="head">Conceptual DVS pixel — signal path</text><text x="48" y="73" class="sub">Functional analog model based on classical temporal-contrast sensor descriptions; not a transistor-level circuit diagram.</text><g transform="translate(28 130)"><circle cx="38" cy="65" r="29" fill="none" stroke="#e7f1fa" stroke-width="3"/><path d="M25 49 v33 M43 49 v33 M24 65 h20" stroke="#e7f1fa" stroke-width="3"/><path class="light" d="M0 3 L21 31 M35 0 L40 28"/><text class="txt" x="8" y="124">Photodiode</text><text class="sub" x="13" y="146">photocurrent</text></g><path class="wire" d="M145 190 H192"/><rect class="block" x="193" y="146" rx="15" width="185" height="112"/><text class="txt" x="214" y="182">Logarithmic</text><text class="txt" x="214" y="207">photoreceptor</text><text class="sub" x="220" y="236">V ∝ log(I)</text><path class="wire" d="M379 202 H422"/><rect class="block" x="424" y="146" rx="15" width="200" height="112"/><text class="txt" x="444" y="181">Change detector</text><text class="sub" x="443" y="206">Differencing /</text><text class="sub" x="443" y="227">amplification</text><path class="wire" d="M626 202 H671"/><path d="M672 202 V163 H700 M672 202 V240 H700" fill="none" stroke="#8adfeb" stroke-width="3"/><rect class="block" x="703" y="121" rx="13" width="176" height="75"/><rect class="block" x="703" y="218" rx="13" width="176" height="75"/><text class="txt" x="723" y="152">ON comparator</text><text class="sub" x="725" y="177">ΔL ≥ C⁺</text><text class="txt" x="723" y="248">OFF comparator</text><text class="sub" x="725" y="273">ΔL ≤ −C⁻</text><path class="wire" d="M880 158 H938 V203 H968"/><path class="wire" d="M880 255 H938 V210 H968"/><rect class="block" x="971" y="157" rx="15" width="193" height="109"/><text class="txt" x="988" y="190">AER readout</text><text class="sub" x="988" y="214">Address + polarity</text><text class="sub" x="988" y="237">(timestamp downstream)</text><rect x="430" y="337" width="274" height="69" rx="14" fill="#342b2a" stroke="#f4a16c" stroke-width="2"/><text x="457" y="365" class="txt">Reference / reset</text><text x="455" y="388" class="sub">stored comparison level</text><path class="fb" d="M789 295 V370 H704"/><path class="fb" d="M430 371 H385 V264 H488 V259"/><text x="740" y="350" class="sub">feedback after event</text><text x="45" y="439" class="sub">Real circuit topologies differ by design; bias settings, mismatch, noise, and refractory behavior affect real output.</text></svg>