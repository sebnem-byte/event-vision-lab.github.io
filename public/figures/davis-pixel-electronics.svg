<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="485" viewBox="0 0 1180 485"><rect width="1180" height="485" rx="22" fill="#091728"/><style>text{font-family:Inter,Arial,sans-serif;fill:#deebfa} .ttl{font-size:25px;font-weight:700;fill:#f4f8ff}.sub{font-size:14px;fill:#a9bdd1}.lbl{font-size:17px;font-weight:650}.tiny{font-size:13px;fill:#b9cce0}.panel{fill:#101e34;stroke:#295272;stroke-width:1.7}.line{stroke:#a8c6df;stroke-width:2;fill:none}.cyan{stroke:#32c9f2;fill:none;stroke-width:3}.orange{stroke:#fb8b6c;fill:none;stroke-width:3}</style><text x="30" y="54" class="ttl" >Simplified DAVIS pixel electronics</text><text x="30" y="78" class="sub" >Functional abstraction, not a transistor-level schematic. APS and DVS share light detection.</text><rect x="25" y="115" width="190" height="310" rx="12" class="panel"/><text x="44" y="150" class="lbl" >Photodiode</text><text x="44" y="177" class="tiny" >Iph ~ illumination</text><circle cx="119" cy="272" r="46" fill="#173a53" stroke="#52c8e6" stroke-width="2"/><text x="87" y="279" class="ttl" >PD</text><rect x="260" y="115" width="220" height="130" rx="12" class="panel"/><text x="279" y="147" class="lbl" >APS pathway</text><text x="279" y="172" class="tiny" >Sample / integrate</text><rect x="285" y="185" width="166" height="39" rx="8" class="panel"/><text x="302" y="210" class="tiny" >Frame readout</text><rect x="260" y="270" width="220" height="155" rx="12" class="panel"/><text x="278" y="302" class="lbl" >Log photoreceptor</text><text x="278" y="327" class="tiny" >L(t) = log I(t)</text><rect x="290" y="348" width="160" height="46" rx="8" class="panel"/><text x="320" y="377" class="tiny" >Log front-end</text><rect x="535" y="270" width="222" height="155" rx="12" class="panel"/><text x="554" y="302" class="lbl" >Change detector</text><rect x="555" y="329" width="177" height="58" rx="8" class="panel"/><text x="572" y="354" class="tiny" >Delta L(t) =</text><text x="572" y="373" class="tiny" >L(t) − Lref</text><rect x="812" y="115" width="340" height="310" rx="12" class="panel"/><text x="831" y="150" class="lbl" >ON / OFF comparators</text><rect x="833" y="181" width="280" height="65" rx="8" class="panel"/><text x="852" y="209" class="lbl" >ON: Delta L ≥ C+</text><text x="852" y="231" class="tiny" >positive event</text><rect x="833" y="271" width="280" height="65" rx="8" class="panel"/><text x="852" y="300" class="lbl" >OFF: Delta L ≤ −C−</text><text x="852" y="322" class="tiny" >negative event</text><rect x="833" y="363" width="280" height="42" rx="8" class="panel"/><text x="852" y="391" class="tiny" >Reference / reset feedback</text><path d="M217 264 L259 190" stroke="#2bcaf1" stroke-width="3" fill="none"/><path d="M249 184 L259 190 L249 196" fill="none" stroke="#2bcaf1" stroke-width="3"/><path d="M217 287 L258 351" stroke="#2bcaf1" stroke-width="3" fill="none"/><path d="M248 345 L258 351 L248 357" fill="none" stroke="#2bcaf1" stroke-width="3"/><path d="M481 354 L533 354" stroke="#2bcaf1" stroke-width="3" fill="none"/><path d="M523 348 L533 354 L523 360" fill="none" stroke="#2bcaf1" stroke-width="3"/><path d="M760 348 L810 246" stroke="#2bcaf1" stroke-width="3" fill="none"/><path d="M800 240 L810 246 L800 252" fill="none" stroke="#2bcaf1" stroke-width="3"/><path d="M760 363 L810 305" stroke="#2bcaf1" stroke-width="3" fill="none"/><path d="M800 299 L810 305 L800 311" fill="none" stroke="#2bcaf1" stroke-width="3"/><path d="M833 385 H791 V450 H630 V426" fill="none" stroke="#f8ac69" stroke-width="3"/></svg>