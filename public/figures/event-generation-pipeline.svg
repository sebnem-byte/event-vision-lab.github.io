<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="416" viewBox="0 0 1220 416"><rect width="1220" height="416" rx="22" fill="#091728"/><style>text{font-family:Inter,Arial,sans-serif;fill:#deebfa} .ttl{font-size:25px;font-weight:700;fill:#f4f8ff}.sub{font-size:14px;fill:#a9bdd1}.lbl{font-size:17px;font-weight:650}.tiny{font-size:13px;fill:#b9cce0}.panel{fill:#101e34;stroke:#295272;stroke-width:1.7}.line{stroke:#a8c6df;stroke-width:2;fill:none}.cyan{stroke:#32c9f2;fill:none;stroke-width:3}.orange{stroke:#fb8b6c;fill:none;stroke-width:3}</style><text x="36" y="57" class="ttl" >From light to asynchronous events</text><text x="36" y="83" class="sub" >A conceptual flow: analog brightness change produces sparse digital events.</text><rect x="30" y="115" width="270" height="270" rx="12" class="panel"/><text x="46" y="145" class="lbl" >1  PHOTORECEPTION</text><rect x="325" y="115" width="270" height="270" rx="12" class="panel"/><text x="341" y="145" class="lbl" >2  CHANGE DETECTION</text><rect x="620" y="115" width="270" height="270" rx="12" class="panel"/><text x="636" y="145" class="lbl" >3  THRESHOLD TEST</text><rect x="915" y="115" width="270" height="270" rx="12" class="panel"/><text x="931" y="145" class="lbl" >4  EVENT OUTPUT</text><path d="M303 247 L319 247" stroke="#2bcaf1" stroke-width="3" fill="none"/><path d="M309 241 L319 247 L309 253" fill="none" stroke="#2bcaf1" stroke-width="3"/><path d="M598 247 L614 247" stroke="#2bcaf1" stroke-width="3" fill="none"/><path d="M604 241 L614 247 L604 253" fill="none" stroke="#2bcaf1" stroke-width="3"/><path d="M893 247 L909 247" stroke="#2bcaf1" stroke-width="3" fill="none"/><path d="M899 241 L909 247 L899 253" fill="none" stroke="#2bcaf1" stroke-width="3"/><text x="48" y="189" class="lbl" >Light → photocurrent</text><path d="M60 300 L260 300" stroke="#37c8ef" stroke-width="2" fill="none"/><circle cx="76" cy="246" r="4" fill="#f6d678"/><circle cx="103" cy="260" r="5" fill="#f6d678"/><circle cx="130" cy="266" r="4" fill="#f6d678"/><circle cx="157" cy="260" r="5" fill="#f6d678"/><circle cx="184" cy="245" r="4" fill="#f6d678"/><circle cx="211" cy="231" r="5" fill="#f6d678"/><circle cx="238" cy="226" r="4" fill="#f6d678"/><text x="48" y="343" class="tiny" >Photodiode + logarithmic</text><text x="48" y="362" class="tiny" >photoreceptor</text><text x="343" y="198" class="lbl" >L(t) = log I(t)</text><rect x="356" y="225" width="206" height="54" rx="8" class="panel"/><text x="371" y="258" class="tiny" >Current − reference</text><text x="343" y="343" class="tiny" >Delta L = L(t) − Lref</text><text x="640" y="191" class="tiny" >Positive change</text><rect x="649" y="211" width="211" height="52" rx="8" class="panel"/><text x="666" y="243" class="lbl" >Delta L ≥ C+</text><text x="640" y="298" class="tiny" >Negative change</text><rect x="649" y="316" width="211" height="52" rx="8" class="panel"/><text x="665" y="349" class="lbl" >Delta L ≤ −C−</text><text x="935" y="200" class="lbl" >(x, y, t, p)</text><text x="935" y="247" class="lbl" >ON: p = +1</text><text x="935" y="290" class="lbl" >OFF: p = −1</text><text x="935" y="343" class="tiny" >Update reference</text></svg>